# 目标配置合同。所有相对文件路径以启动工作目录为基准。
# Slice 2 已交付 sync 与 sync --dry-run，以及显式 cleanup.enabled: true 的
# 完整轮缺失确认与安全删除；Slice 3 已实现 serve 常驻调度。
openlist:
  api_url: "http://127.0.0.1:15244"
  public_url: "https://openlist.example.invalid"
  token_env: "OPENLIST_TOKEN"

sources:
  - remote: "/Movies"
    output: "./artifacts/dev-env/strm/Movies"

sync:
  # serve 首轮立即执行，之后每 interval_minutes 分钟运行一轮；缺省 60。
  # 必须是大于 0 的整数；0、负数、非整数和转换溢出在触碰输出／数据库前退出 2。
  interval_minutes: 60
  directory_workers: 4
  atomic_write: true
  skip_unchanged: true
  # mirror=false 只生成／更新；它不允许同时开启 cleanup。
  mirror: true
  # 生成哪些源文件扩展名。整段省略时使用内置 11 项：
  # .mkv .mp4 .m4v .avi .mov .wmv .webm .ts .m2ts .mpg .mpeg
  # 显式列表完整替换默认项，不合并；必须是非空字符串列表，每项可选一个前导点、
  # 大小写与首尾空白规范化并去重。空列表、null、非字符串、空项、路径、通配符、
  # 多段后缀和 .strm 会让命令在创建输出／数据库前以退出码 2 结束。
  # 移除某个扩展名后，对应的已归属 STRM 按普通缺失计数处理（源文件仍存在也一样），
  # 仍需 cleanup.enabled 与完整轮阈值；加回后清零并保留或重新生成。
  # serve 在启动时读取本配置，修改后需重启生效。
  media_extensions: [".mkv", ".mp4", ".m4v", ".avi", ".mov", ".wmv", ".webm", ".ts", ".m2ts", ".mpg", ".mpeg"]

# 清理默认关闭。只有显式 enabled: true 且 mirror 开启时才按已提交的完整轮
# 缺失证据删除；阈值最低 3，更大的值只会延后清理。
cleanup:
  enabled: false
  missing_confirmations: 3

database:
  path: "./artifacts/dev-env/data/strmgen.db"
