# 目标配置合同。所有相对文件路径以启动工作目录为基准。
# Slice 2 已交付 sync 与 sync --dry-run，以及显式 cleanup.enabled: true 的
# 完整轮缺失确认与安全删除；Slice 3 已实现 serve 常驻调度。
openlist:
  api_url: "http://127.0.0.1:15244"
  public_url: "https://openlist.example.invalid"
  token_env: "OPENLIST_TOKEN"

sources:
  - remote: "/Movies"
    output: "./artifacts/dev-env/strm/Movies"

sync:
  # serve 首轮立即执行，之后每 interval_minutes 分钟运行一轮；缺省 60。
  # 必须是大于 0 的整数；0、负数、非整数和转换溢出在触碰输出／数据库前退出 2。
  interval_minutes: 60
  directory_workers: 4
  atomic_write: true
  skip_unchanged: true
  # mirror=false 只生成／更新；它不允许同时开启 cleanup。
  mirror: true
  # 生成哪些源文件扩展名。整段省略时使用内置 11 项：
  # .mkv .mp4 .m4v .avi .mov .wmv .webm .ts .m2ts .mpg .mpeg
  # 显式列表完整替换默认项，不合并；必须是非空字符串列表，每项可选一个前导点、
  # 大小写与首尾空白规范化并去重。空列表、null、非字符串、空项、路径、通配符、
  # 多段后缀和 .strm 会让命令在创建输出／数据库前以退出码 2 结束。
  # 移除某个扩展名后，对应的已归属 STRM 按普通缺失计数处理（源文件仍存在也一样），
  # 仍需 cleanup.enabled 与完整轮阈值；加回后清零并保留或重新生成。
  # serve 在启动时读取本配置，修改后需重启生效。
  media_extensions: [".mkv", ".mp4", ".m4v", ".avi", ".mov", ".wmv", ".webm", ".ts", ".m2ts", ".mpg", ".mpeg"]

# 清理默认关闭。只有显式 enabled: true 且 mirror 开启时才按已提交的完整轮
# 缺失证据删除；阈值最低 3，更大的值只会延后清理。
cleanup:
  enabled: false
  missing_confirmations: 3

database:
  path: "./artifacts/dev-env/data/strmgen.db"

# Telegram 运行通知，默认关闭。整段省略或 enabled 省略时行为与旧配置完全一致。
# 启用后，普通 sync／serve 在启动时读取通知环境变量；Bot Token 或目标缺失／为空
# 只记录脱敏警告并跳过本进程的通知，同步照常进行，退出码不变。
# dry-run 校验配置结构但不要求通知环境值、不创建临时清单、不发送。
# 每轮 sync／serve 聚合所有 source 只发送一条中文摘要；整个正文（含来源明细）共用
# 最多 3500 个 UTF-16 code units 的预算、预览 20 条文件事件，装不下时附本轮单个
# UTF-8 文本清单（总大小上限 8 MiB，超限停止追加并标明不完整；来源明细溢出也进入
# 同一清单）。临时清单创建或写入失败时摘要仍按策略发送，并明确标注明细不完整。
# 发送在网络与锁释放后执行；凭证只来自环境变量，配置文件不保存 Token，
# 消息与附件不包含 Token、Chat ID、媒体 URL 或私有绝对路径。
notifications:
  telegram:
    enabled: false
    # 实例名，出现在通知标题中；省略为 "STRM Generator"。显式提供须为非空单行
    # YAML 字符串（数字、布尔等标量会被拒绝）；校验不读取凭证也不创建文件，
    # enabled: false 时同样生效。
    instance_name: "家庭媒体"
    # 凭证环境变量名；省略分别使用默认名 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID。
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"
    # 发送策略：all 每轮发送；error 仅同步失败与初始化失败；
    # change_or_error 失败之外，有新增／更新／实际删除／归属回收或待删除计数
    # 提交变化时发送。仅 skipped／filtered 或保留统计不触发 change_or_error。
    policy: "all"
