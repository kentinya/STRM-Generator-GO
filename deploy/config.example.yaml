# Product container configuration example.
#
# Copy this file to deploy/config.yaml and edit it. It is mounted read-only at
# /etc/strmgen/config.yaml. It must never contain a token: the token is read at
# runtime from the environment variable named by openlist.token_env.
#
# Paths are resolved relative to the process working directory, which is the
# container root. The container mounts are:
#   /etc/strmgen/config.yaml  read-only configuration
#   /output                   STRM output tree
#   /state                    SQLite database and sidecars
#   /tmp/strmgen-locks        fixed shared lock namespace
openlist:
  api_url: "http://openlist:5244"
  public_url: "https://openlist.example.invalid"
  token_env: "OPENLIST_TOKEN"

sources:
  - remote: "/Movies"
    output: "/output/Movies"

sync:
  # serve runs one immediate round, then repeats every interval_minutes.
  interval_minutes: 60
  directory_workers: 4
  atomic_write: true
  skip_unchanged: true
  mirror: true
  # Which source file extensions are generated. Omitting the key keeps the
  # built-in 11 entries: .mkv .mp4 .m4v .avi .mov .wmv .webm .ts .m2ts .mpg .mpeg
  # An explicit list fully replaces the defaults (no merging). It must be a
  # non-empty list of strings; one optional leading dot is accepted, case and
  # surrounding blanks are normalised and duplicates collapse. An empty list,
  # null, a non-string element, an empty item, a path, a wildcard, a
  # multi-segment suffix or .strm exits 2 before output or database creation.
  # Removing an extension sends its owned STRM into the normal missing-count
  # path even while the source file still exists; cleanup.enabled and the
  # complete-round threshold still apply. Adding it back clears the count and
  # keeps or regenerates the file.
  # serve reads this file at startup; a change requires a restart.
  media_extensions: [".mkv", ".mp4", ".m4v", ".avi", ".mov", ".wmv", ".webm", ".ts", ".m2ts", ".mpg", ".mpeg"]

cleanup:
  # Cleanup stays off unless explicitly enabled together with mirror: true.
  enabled: false
  missing_confirmations: 3

database:
  # Must stay on the persistent /state mount so ownership and rounds survive a
  # container restart. Never place it inside /output.
  path: "/state/strmgen.db"
