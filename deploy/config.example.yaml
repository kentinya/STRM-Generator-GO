# Product container configuration example.
#
# Copy this file to deploy/config.yaml and edit it. It is mounted read-only at
# /etc/strmgen/config.yaml. It must never contain a token: the token is read at
# runtime from the environment variable named by openlist.token_env.
#
# Paths are resolved relative to the process working directory, which is the
# container root. The container mounts are:
#   /etc/strmgen/config.yaml  read-only configuration
#   /output                   STRM output tree
#   /state                    SQLite database and sidecars
#   /tmp/strmgen-locks        fixed shared lock namespace
openlist:
  api_url: "http://openlist:5244"
  public_url: "https://openlist.example.invalid"
  token_env: "OPENLIST_TOKEN"

sources:
  - remote: "/Movies"
    output: "/output/Movies"

sync:
  # serve runs one immediate round, then repeats every interval_minutes.
  interval_minutes: 60
  directory_workers: 4
  atomic_write: true
  skip_unchanged: true
  mirror: true
  # Which source file extensions are generated. Omitting the key keeps the
  # built-in 11 entries: .mkv .mp4 .m4v .avi .mov .wmv .webm .ts .m2ts .mpg .mpeg
  # An explicit list fully replaces the defaults (no merging). It must be a
  # non-empty list of strings; one optional leading dot is accepted, case and
  # surrounding blanks are normalised and duplicates collapse. An empty list,
  # null, a non-string element, an empty item, a path, a wildcard, a
  # multi-segment suffix or .strm exits 2 before output or database creation.
  # Removing an extension sends its owned STRM into the normal missing-count
  # path even while the source file still exists; cleanup.enabled and the
  # complete-round threshold still apply. Adding it back clears the count and
  # keeps or regenerates the file.
  # serve reads this file at startup; a change requires a restart.
  media_extensions: [".mkv", ".mp4", ".m4v", ".avi", ".mov", ".wmv", ".webm", ".ts", ".m2ts", ".mpg", ".mpeg"]

  # Optional subtitle downloads, disabled by default. An omitted block or an
  # omitted enabled keeps historical behavior. When enabled, directories whose
  # videos produced a usable STRM this round also copy their missing selected
  # subtitle files beside the STRM, keeping the remote file names and bytes.
  # The two fields below belong to the FIX-SUB-01 candidate; the published
  # v1.3.0 tag is the pre-fix release and does not support these fields or the
  # classified Telegram statistics.
  # Downloads use the stable openlist.public_url + /d/ address without the API
  # token: the mount behind public_url must serve /d/ to the container (in
  # compose the same URL Jellyfin consumers use). At most one subtitle is in
  # flight; consecutive download attempts start at least
  # download_interval_seconds apart (default 1, minimum 0.5, integral or finite
  # fractional values such as 0.5/1/1.5). Each file gets a 30-second budget
  # counted from the actual download start, at most five HTTP(S) redirects and
  # an 8 MiB response ceiling. The subtitle client uses its own transport;
  # use_http2 defaults to false and keeps every hop on HTTP/1.1 even when the
  # HTTPS service supports HTTP/2; an explicit true allows HTTPS HTTP/2 with an
  # HTTP/1.1 fallback. Successfully published subtitles are owned like STRM
  # files and share the cleanup switches and the three-round confirmation.
  # extensions defaults to the four-entry whitelist .srt .ass .ssa .vtt; an
  # explicit list may only pick a subset and must not overlap media_extensions
  # while enabled. The new fields are validated even while the feature is off.
  # serve reads this file at startup; a change requires a restart.
  subtitles:
    enabled: false
    extensions: [".srt", ".ass", ".ssa", ".vtt"]
    download_interval_seconds: 1
    use_http2: false

cleanup:
  # Cleanup stays off unless explicitly enabled together with mirror: true.
  enabled: false
  missing_confirmations: 3

database:
  # Must stay on the persistent /state mount so ownership and rounds survive a
  # container restart. Never place it inside /output.
  path: "/state/strmgen.db"

# Optional Telegram round notifications, disabled by default. An omitted block
# keeps historical behavior. Credentials come only from the host environment
# (passed through with value-less entries in compose.yaml); the config file
# never stores a token. Round summaries and attachments never contain the
# token, the chat id, media URLs or private absolute paths.
notifications:
  telegram:
    enabled: false
    instance_name: "STRM Generator"
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"
    policy: "all"
